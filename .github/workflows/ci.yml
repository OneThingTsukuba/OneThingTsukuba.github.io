# PR の時点でビルドと型チェックを走らせる。
#
# deploy.yml は main への push と cron でしか動かないため、
# frontmatter の欠落やルート生成の失敗が、マージして本番デプロイが落ちるまで気づけなかった。
# ここで先に落とす。デプロイはしない。
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run check

      - name: Build
        run: npm run build
